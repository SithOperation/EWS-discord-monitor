name: EWS Discord Monitor

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


permissions:

  contents: write



jobs:

  monitor:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          pip install -r requirements.txt



      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |

          python monitor.py



      - name: Verify state file
        run: |

          ls -lh state.json

          cat state.json



      - name: Commit state

        run: |

          git config user.name "ews-monitor"

          git config user.email "ews-monitor@users.noreply.github.com"


          git add state.json


          if git diff --cached --quiet; then

            echo "No changes"

            exit 0

          fi


          git commit -m "Update EWS state"


          git push
